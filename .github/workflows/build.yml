# NovaUnlock Desktop — construction de l'installateur Windows (.exe) sur GitHub Actions.
#
# Ce fichier applique exactement la procédure décrite dans README.md, sans en retirer
# aucune étape de sécurité :
#   1. les outils natifs libimobiledevice sont compilés depuis les sources amont
#      épinglées de scripts/native-sources.lock, avec MSYS2 UCRT64, par le script
#      versionné scripts/build-native-msys2.sh : aucun exécutable tiers précompilé
#      n'est téléchargé ;
#   2. l'application est compilée puis empaquetée par electron-builder ;
#   3. les fichiers .exe obtenus sont joints à l'exécution (onglet Actions →
#      « Artifacts ») et, pour une étiquette v<version>, publiés dans l'onglet
#      Releases du dépôt.
#
# Utilisation :
#   - onglet « Actions » → « Construire l'installateur Windows » → « Run workflow »
#     pour une construction manuelle ;
#   - `git tag v1.0.0 && git push origin v1.0.0` pour publier une Release complète.
#
# Les demandes de fusion ne lancent que la vérification rapide (lint + tests) : la
# compilation native de MSYS2 dure plusieurs dizaines de minutes.

name: Construire l'installateur Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Le jeton par défaut reste en lecture seule ; seul le travail de publication reçoit
# l'autorisation d'écrire une Release.
permissions:
  contents: read

# Deux constructions du même point de départ se marcheraient dessus (disque, minutes
# de calcul, cache npm) : la seconde attend la fin de la première.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Doit satisfaire le champ « engines » de package.json (^22.22.2) : la dernière
  # version 22.x publiée est résolue à chaque exécution.
  NODE_VERSION: ">=22.22.2 <23"
  # Nom de l'artefact qui transporte les outils natifs entre les travaux.
  NATIVE_ARTIFACT: novaunlock-native-win-x64

jobs:
  verifier:
    name: Lint et tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js x64
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          check-latest: true
          cache: npm

      # --ignore-scripts : le lint et les tests unitaires sont en JavaScript pur ; les
      # modules natifs (usb, node-hid) et le binaire Electron ne servent pas ici, et
      # leur compilation ralentirait la vérification sans rien prouver de plus.
      - name: Installer les dépendances verrouillées
        run: npm ci --include=dev --ignore-scripts

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

  outils-natifs:
    name: Outils natifs libimobiledevice (MSYS2 UCRT64)
    runs-on: windows-latest
    needs: verifier
    # La compilation MSYS2 est longue : elle est réservée à main, aux étiquettes et
    # aux exécutions manuelles. Une demande de fusion ne la déclenche pas, sauf si
    # l'étiquette « construction-native » lui est posée explicitement : ce levier
    # sert à reproduire un échec de compilation sans fusionner d'abord sur main.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'construction-native')
    timeout-minutes: 240
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      # Le payload déjà compilé est restauré sous une clé qui contient l'empreinte des
      # sources épinglées : modifier native-sources.lock ou un correctif change la clé
      # et force une recompilation. Aucune clé de repli (restore-keys) n'est déclarée :
      # un cache approximatif ne doit jamais réutiliser des binaires d'une autre
      # version. Le payload restauré est vérifié plus bas, comme après compilation.
      - name: Restaurer le payload natif déjà compilé
        id: cache-native
        uses: actions/cache@v6
        with:
          path: native/libimobiledevice
          key: novaunlock-native-win-x64-${{ hashFiles('scripts/native-sources.lock', 'scripts/patches/*.patch') }}

      - name: Installer MSYS2 (UCRT64)
        if: steps.cache-native.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      # Le script installe lui-même la liste de paquets qu'il utilise : la version
      # locale (Creer-installateur-Windows.cmd) et la version CI compilent donc avec
      # le même outillage. NOVAUNLOCK_PACMAN_NOCONFIRM évite l'invite interactive.
      #
      # tee conserve la sortie complète dans le dépôt de travail : le script
      # n'écrit des .log qu'à partir du premier autogen.sh, donc un échec survenant
      # avant (paquetage MSYS2, clonage, vérification des commandes) ne laissait
      # aucune trace exploitable. pipefail garantit que l'échec du script reste
      # l'échec de l'étape malgré le tuyau vers tee.
      - name: Compiler les outils depuis les sources amont épinglées
        if: steps.cache-native.outputs.cache-hit != 'true'
        shell: "msys2 {0}"
        env:
          NOVAUNLOCK_PACMAN_NOCONFIRM: "1"
        run: |
          set -o pipefail
          mkdir -p .native-build
          bash scripts/build-native-msys2.sh 2>&1 | tee .native-build/compilation-native.log

      - name: Installer Node.js x64 (vérification du payload)
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          check-latest: true

      - name: Vérifier les six outils natifs attendus
        shell: pwsh
        run: node scripts/verify-native.cjs

      # Les journaux bruts d'un travail ne se téléchargent que depuis un navigateur.
      # Les annotations, elles, sont exposées par l'API check-runs : publier les
      # lignes d'erreur en annotation rend l'échec lisible sans ouvrir l'interface
      # ni récupérer l'artefact.
      - name: Publier les erreurs de compilation en annotation
        if: failure()
        shell: bash
        run: |
          bash scripts/publish-failure-annotation.sh \
            .native-build/compilation-native.log \
            "error:|\*\*\* |Error [0-9]+" \
            "Compilation native — lignes d'erreur :"

      - name: Conserver les journaux de compilation en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journaux-compilation-native
          path: |
            .native-build/logs
            .native-build/compilation-native.log
          # Un échec survenu avant le premier autogen.sh ne produit aucun .log :
          # « warn » le signale au lieu de laisser croire que des journaux existent.
          if-no-files-found: warn
          retention-days: 14

      - name: Transmettre le payload natif au travail d'empaquetage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NATIVE_ARTIFACT }}
          path: native/libimobiledevice
          if-no-files-found: error
          retention-days: 7

  installateur:
    name: Installateur et version portable (.exe)
    runs-on: windows-latest
    needs: outils-natifs
    timeout-minutes: 120
    permissions:
      contents: write # nécessaire pour créer la Release sur une étiquette v*
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js x64
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          architecture: x64
          check-latest: true
          cache: npm

      # Ici les scripts d'installation s'exécutent : electron, usb et node-hid
      # installent les binaires natifs Windows dont dépend l'application.
      - name: Installer les dépendances verrouillées
        run: npm ci --include=dev

      # La sortie est conservée : un test qui n'échoue que sur Windows ne se
      # diagnostique pas depuis les journaux bruts, inaccessibles par API.
      #
      # Ces tests précèdent volontairement la récupération du payload natif :
      # plusieurs décrivent un poste sans outils natifs — c'est le cas sur ubuntu
      # et en local — et l'un d'eux exige que le binaire de restauration soit
      # absent (« introuvable »). Les exécuter après le téléchargement les ferait
      # échouer pour une raison d'environnement, pas de code.
      - name: Tests unitaires sur Windows
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee tests-windows.log

      - name: Publier les tests en échec en annotation
        if: failure()
        shell: bash
        run: |
          bash scripts/publish-failure-annotation.sh \
            tests-windows.log \
            "FAIL|AssertionError|Error:|expected|Tests  " \
            "Tests Windows — échecs :"

      - name: Récupérer les outils natifs compilés
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.NATIVE_ARTIFACT }}
          path: native/libimobiledevice

      - name: Vérifier le payload reçu
        shell: pwsh
        run: node scripts/verify-native.cjs

      # package:win exécute verify:native, compile l'interface et le processus
      # principal, puis electron-builder (cibles nsis et portable de package.json).
      # --publish never : la publication est faite plus bas, jamais par electron-builder.
      - name: Compiler l'application et créer les .exe
        env:
          # Aucun certificat de signature n'est fourni au dépôt : Electron Builder
          # ignore la signature au lieu d'échouer sur une identité absente.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:win -- --publish never

      - name: Calculer les empreintes SHA-256 des fichiers livrés
        shell: bash
        run: |
          cd release
          sha256sum ./*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publier les .exe dans les artefacts de l'exécution
        uses: actions/upload-artifact@v7
        with:
          name: NovaUnlock-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Une étiquette v1.0.0 qui ne correspond pas à la version de package.json
      # produirait des fichiers mal nommés : la différence arrête la publication.
      - name: Publier la Release GitHub (étiquette v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::L'étiquette ${GITHUB_REF_NAME} ne correspond pas à la version ${version} de package.json."
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/*.exe release/SHA256SUMS.txt --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/*.exe release/SHA256SUMS.txt \
              --title "NovaUnlock ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
          echo "Release publiée : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
